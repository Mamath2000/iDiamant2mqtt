# Configuration Docker test
[netatmo]
api_url = https://api.netatmo.com
redirect_uri = https://example.com/callback
client_id = test_client_id
client_secret = test_client_secret

[device]
idiamant_ip = 192.168.1.100

[mqtt]
broker_url = mqtt://localhost:1883
username = 
password = 
client_id = idiamant2mqtt_test
topic_prefix = idiamant2mqtt
keepalive = 60

[homeassistant]
discovery = false
discovery_prefix = homeassistant
device_name = iDiamant Bridge Test

[logging]
console_level = info
file_level = debug
auth_level = debug
mqtt_level = info

[application]
environment = production
sync_interval = 30000
auth_server_port = 3000
auth_server_host = 0.0.0.0
log_directory = ./logs
app_log_file = app.log
auth_log_file = auth.log